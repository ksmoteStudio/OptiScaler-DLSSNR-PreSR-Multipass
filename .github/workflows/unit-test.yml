# Compiles and runs the standalone C++ unit tests under tests/.
#
# Added 2026-10-07. Until this existed, NO workflow compiled or ran any test:
# searching every workflow for `cl.exe`, `tests/` or `run_*.ps1` returns zero
# hits, and `test.yml` despite its name only did version extraction and
# nightly-release bookkeeping. Sixty-one test files existed and never executed.
#
# Only the tests named by run_all_unit.ps1's -Required list gate the build. The
# rest are compiled and run and reported, because turning them on for the first
# time is exactly how we find out how many are already broken.

name: Unit Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    # Must be its own step. A hand-rolled VsDevCmd.bat call that pipes `set`
    # into $env:GITHUB_ENV does not take effect until the NEXT step, so a
    # same-step `Get-Command cl.exe` fails and the job dies before a single
    # test is compiled. That is exactly what the first attempt did.
    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Confirm the compiler is reachable
      shell: pwsh
      run: |
        $cl = (Get-Command cl.exe -ErrorAction Stop).Source
        Write-Output "cl.exe -> $cl"
        cl.exe 2>&1 | Select-Object -First 3

    - name: Run unit tests
      shell: pwsh
      run: .\tests\run_all_unit.ps1